<body>
<header><div class="brand"><div class="mark" aria-hidden="true">Q</div><div><h1>คำนวณแรงโครงหลังคา</h1><p>จากวัสดุมุงถึงจุดรองรับหลังคา</p></div></div></header>

<script>
'use strict';
const TYPES=['T','P','J','K','A','D','B'];
const BASE={T:'ระแนง',P:'แป',J:'จันทัน',K:'อกไก่',A:'อะเส',D:'ดั้ง',B:'ขื่อ'};
const CASES=['คงที่','จร','ลมกด','ลมยก'];
const KEY='q-roof-project-v1';
const blank=()=>[0,0,0,0];
const clone=x=>JSON.parse(JSON.stringify(x));
const n=x=>x===''||x==null||typeof x==='boolean'?NaN:Number(x);
const good=x=>Number.isFinite(n(x));
const zero=x=>good(x)?n(x):0;
const nice=x=>Math.abs(x)<1e-8?0:x;
const finite=x=>typeof x==='number'&&Number.isFinite(x);
const s=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const fmt=x=>finite(x)?nice(x).toLocaleString('th-TH',{maximumFractionDigits:3}):'–';
const uid=()=>crypto.randomUUID?.()??('m'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const addVec=(a,b)=>a.map((v,i)=>v==null||b[i]==null?null:v+b[i]);
const sums=vs=>vs.reduce(addVec,blank());
const by=x=>state.members.find(m=>m.id===x);
const typeName=t=>state.names[t]||BASE[t];
const ordered=m=>TYPES.indexOf(m.type);
const carriesCover=t=>t==='P'||t==='T';
const support=(to,at='',status='member',kind='เสา',span='')=>({status,to,at,kind,span});
function sample(){
  const project={v:1,name:'ตัวอย่างหลังคาจั่ว',shape:'จั่ว',slope:30,material:'M01',live:50,liveBasis:'plan',windDown:10,windUp:35,
    names:{...BASE},materialRows:[
      {id:'M01',name:'วัสดุมุงสมมุติ',value:12,unit:'กก./ตร.ม. ผิวลาด',note:'น้ำหนักตัวอย่างสำหรับทดลองสูตร'},
      {id:'M02',name:'บล็อกมวลเบา Q-CON 7.5 ซม.',value:46.5,unit:'กก./ตร.ม. ผนัง',note:'เฉพาะบล็อกตามคู่มือ Q-CON'},
      {id:'M03',name:'อิฐบล็อกคอนกรีต',value:'',unit:'กก./ตร.ม. ผนัง',note:'กรอกตามรุ่นและเพิ่มปูนก่อหรือฉาบตามจริง'},
      {id:'M04',name:'คอนกรีตน้ำหนักปกติ',value:2400,unit:'กก./ลบ.ม.',note:'ค่าประมาณตั้งต้น'},
      {id:'M05',name:'เหล็กโครงสร้าง',value:7850,unit:'กก./ลบ.ม.',note:'ค่าประมาณตั้งต้น'}
    ],fc:'',test:'ทรงกระบอก',fy:'',members:[]};
  const add=(id,type,own,spans,supports,attrs={})=>project.members.push({id,type,own,spacing:spans,supports,left:0,right:0,width:0,slope:'',model:'continuous',q:blank(),points:[],...attrs});
  for(const side of ['L','R']){
    [0.6,1.8,3].forEach((a,k)=>add('P-'+side+(k+1),'P',1.2,3,[support('J-'+side+'1',a),support('J-'+side+'2',a),support('J-'+side+'3',a,'member','เสา',4)],{width:k===0?1.5:1.2}));
    [1,2,3].forEach(k=>add('J-'+side+k,'J',3,3.6,[support('A-'+side,[0,3,7][k-1]),support('K-01',[0,3,7][k-1])],{left:.3}));
  }
  add('K-01','K',5,3,[support('D-01',0),support('D-02',0),support('D-03',0,'member','เสา',4)]);
  for(const side of ['L','R']){
    add('A-'+side,'A',4,3,['01','02','03'].map((x,k)=>support('S-'+side+x,'','external','เสา',k===2?4:'')));
  }
  for(const k of [1,2,3]){
    add('D-0'+k,'D',3,1.8,[support('B-0'+k,3) ]);
    add('B-0'+k,'B',4,6,[support('S-L0'+k,'','external'),support('S-R0'+k,'','external')]);
  }
  return project;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);validateFile(x);return x}}catch{}
  return sample();
}
function validateFile(x){
  if(!x||x.v!==1||typeof x.names!=='object'||!x.names||!Array.isArray(x.members)||x.members.length>120||!Array.isArray(x.materialRows)||x.materialRows.length>100)throw new Error('รูปแบบไฟล์โครงการไม่ถูกต้อง');
  const ids=new Set();
  for(const m of x.members){
    if(!m||typeof m.id!=='string'||!m.id.trim()||ids.has(m.id)||!TYPES.includes(m.type)||!Array.isArray(m.supports)||m.supports.length>24||!m.supports.every(a=>a&&typeof a==='object')||!Array.isArray(m.points)||m.points.length>40||!m.points.every(p=>p&&Array.isArray(p.q)&&p.q.length===4)||!Array.isArray(m.q)||m.q.length!==4)throw new Error('ข้อมูลชิ้นส่วนในไฟล์ไม่ครบหรือรหัสซ้ำ');
    ids.add(m.id);
  }
  if(!x.materialRows.every(a=>a&&typeof a.id==='string')||new Set(x.materialRows.map(a=>a.id)).size!==x.materialRows.length)throw new Error('ตรวจรหัสวัสดุในไฟล์');
}
let state=load(), page='info', selected='', calculation=null, pendingRender=null;
const nav=document.getElementById('nav'), view=document.getElementById('view');
function notify(t){document.getElementById('message').textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('เบราว์เซอร์เก็บข้อมูลในเครื่องไม่ได้ ใช้ปุ่มสำรองข้อมูลเพื่อเก็บงาน')}}
function solveLinear(A,b){
  const d=b.length;
  for(let k=0;k<d;k++){
    let pivot=k;
    for(let i=k+1;i<d;i++)if(Math.abs(A[i][k])>Math.abs(A[pivot][k]))pivot=i;
    if(!finite(A[pivot][k])||Math.abs(A[pivot][k])<1e-13)throw Error('ช่วงพาดหรือจุดรองรับทำให้คำนวณระบบไม่ได้');
    if(pivot!==k){[A[k],A[pivot]]=[A[pivot],A[k]];[b[k],b[pivot]]=[b[pivot],b[k]]}
    for(let i=k+1;i<d;i++){
      const factor=A[i][k]/A[k][k];
      if(!factor)continue;
      for(let j=k+1;j<d;j++)A[i][j]-=factor*A[k][j];
      b[i]-=factor*b[k];
    }
  }
  const x=Array(d).fill(0);
  for(let i=d-1;i>=0;i--){let z=b[i];for(let j=i+1;j<d;j++)z-=A[i][j]*x[j];x[i]=z/A[i][i]}
  return x;
}
function beamFixedEI(supports,from,to,segments,points){
  const size=to-from;
  const key=x=>Math.round((x-from)/size*1e10)/1e10;
  const positions=[...new Set([from,to,...supports,...points.map(p=>p.x),...segments.flatMap(p=>[p.a,p.b])].map(key))].sort((a,b)=>a-b);
  if(positions.length>160)throw Error('ชิ้นส่วนหนึ่งมีตำแหน่งคำนวณได้สูงสุด 160 จุด');
  const index=x=>positions.indexOf(key(x));
  const dimension=positions.length*2;
  const K=Array.from({length:dimension},()=>new Float64Array(dimension));
  const F=Array.from({length:dimension},blank);
  for(let i=0;i<positions.length-1;i++){
    const a=positions[i],b=positions[i+1],L=b-a;
    if(L<1e-6)throw Error('ตำแหน่งจุดอยู่ใกล้กันเกินไป กรุณารวมเป็นจุดเดียว');
    const k=[[12,6*L,-12,6*L],[6*L,4*L*L,-6*L,2*L*L],[-12,-6*L,12,-6*L],[6*L,2*L*L,-6*L,4*L*L]];
    const x=from+(a+b)*size/2;
    const q=segments.find(row=>x>=row.a&&x<=row.b).q;
    for(let r=0;r<4;r++){
      for(let j=0;j<4;j++)K[2*i+r][2*i+j]+=k[r][j]/L**3;
      const scale=[L/2,L*L/12,L/2,-L*L/12][r]*size;
      for(let c=0;c<4;c++)F[2*i+r][c]+=scale*(q[c]??0);
    }
  }
  for(const p of points)for(let c=0;c<4;c++)F[2*index(p.x)][c]+=p.q[c]??0;
  const fixed=supports.map(x=>2*index(x)), fix=new Set(fixed);
  const free=Array.from({length:dimension},(_,i)=>i).filter(i=>!fix.has(i));
  const known=CASES.map((_,c)=>!segments.some(p=>p.q[c]==null)&&!points.some(p=>p.q[c]==null));
  const out=fixed.map(blank);
  for(let c=0;c<4;c++){
    if(!known[c]){out.forEach(v=>v[c]=null);continue}
    const u=solveLinear(free.map(i=>free.map(j=>K[i][j])),free.map(i=>F[i][c]));
    fixed.forEach((i,r)=>{out[r][c]=nice(F[i][c]-free.reduce((acc,j,k)=>acc+K[i][j]*u[k],0))});
  }
  return out;
}
function beam(model,supports,from,to,q,points){
  if(model==='separate'){
    const out=supports.map(blank);
    for(let i=0;i<supports.length-1;i++){
      const a=supports[i],b=supports[i+1],lo=i? a:from,hi=i===supports.length-2?to:b;
      const selected=points.filter(p=>(i?p.x>a:p.x>=lo)&&p.x<=hi);
      const [left,right]=beamFixedEI([a,b],lo,hi,[{a:lo,b:hi,q}],selected);
      out[i]=addVec(out[i],left);out[i+1]=addVec(out[i+1],right);
    }
    return out;
  }
  return beamFixedEI(supports,from,to,[{a:from,b:to,q}],points);
}
function geometry(m){
  if(m.type==='D'){
    if(m.supports.length!==1||!good(m.spacing)||n(m.spacing)<=0)throw Error('ใส่ความสูงและจุดรองรับดั้งหนึ่งจุด');
    return {xs:[0],from:0,to:n(m.spacing)};
  }
  if(m.supports.length<2||m.supports.length>24)throw Error('จำนวนจุดรองรับต้องอยู่ระหว่าง 2 ถึง 24 จุด');
  if(!good(m.left)||!good(m.right)||n(m.left)<0||n(m.right)<0)throw Error('ใส่ระยะยื่นเป็นศูนย์หรือค่าบวก');
  if(!['continuous','separate'].includes(m.model))throw Error('เลือกรูปแบบการพาด');
  const xs=[0];
  for(const a of m.supports.slice(1)){
    const L=a.span===''||a.span==null?n(m.spacing):n(a.span);
    if(!finite(L)||L<=0)throw Error('ใส่ระยะพาดแต่ละช่วงให้มากกว่าศูนย์');
    xs.push(xs.at(-1)+L);
  }
  return {xs,from:-n(m.left),to:xs.at(-1)+n(m.right)};
}
function evaluate(project){
  const results=new Map(), destinations=new Map(), incoming=new Map(), errors=[], traces=[];
  const material=project.materialRows.find(x=>x.id===project.material);
  let total=blank();
  const order=project.members.map((m,i)=>[m,i]).sort((a,b)=>ordered(a[0])-ordered(b[0])||a[1]-b[1]).map(([m])=>m);
  for(const m of order){
    try{
      const g=geometry(m), length=g.to-g.from;
      if(!good(m.own)||n(m.own)<0)throw Error('กรอกน้ำหนักตัวเองต่อเมตรเป็นศูนย์หรือค่าบวก');
      if(!Array.isArray(m.q)||m.q.some((v,i)=>!good(v)||(i<2&&n(v)<0)))throw Error('ตรวจน้ำหนักกระจายเพิ่ม');
      const q=m.q.map(n);q[0]+=n(m.own);
      if(carriesCover(m.type)){
        const slope=m.slope===''||m.slope==null?n(project.slope):n(m.slope);
        if(!good(m.width)||n(m.width)<0||!finite(slope)||slope<0||slope>=90)throw Error('ตรวจความกว้างรับน้ำหนักและความลาด');
        const width=n(m.width), plan=width*Math.cos(slope*Math.PI/180);
        if(width>0){
          if(!material||!good(material.value)||n(material.value)<0||!['กก./ตร.ม. ผิวลาด','กก./ตร.ม. แนวราบ'].includes(material.unit))throw Error('เลือกวัสดุมุงและน้ำหนักต่อพื้นที่ที่ใช้ได้');
          if(!good(project.live)||n(project.live)<0||!['plan','slope'].includes(project.liveBasis))throw Error('กรอกน้ำหนักจรและเลือกฐานพื้นที่');
          q[0]+=n(material.value)*(material.unit.endsWith('แนวราบ')?plan:width);
          q[1]+=n(project.live)*(project.liveBasis==='plan'?plan:width);
          q[2]=good(project.windDown)&&n(project.windDown)>=0?q[2]+n(project.windDown)*plan:null;
          q[3]=good(project.windUp)&&n(project.windUp)>=0?q[3]-n(project.windUp)*plan:null;
        }
      }
      const sources=incoming.get(m.id)||[];
      const explicit=m.points.map(p=>{
        if(!good(p.x)||p.q.some((v,i)=>!good(v)||(i<2&&n(v)<0)))throw Error('กรอกตำแหน่งและขนาดแรงจุดให้ครบ');
        return {from:'กรอกเพิ่ม',x:n(p.x),q:p.q.map(n)};
      });
      const points=[...sources,...explicit].map(p=>({...p,x:Math.max(g.from,Math.min(g.to,p.x))}));
      if([...sources,...explicit].some(p=>p.x<g.from-1e-8||p.x>g.to+1e-8))throw Error('ตำแหน่งแรงจุดอยู่นอกความยาวชิ้นส่วน');
      const applied=sums([q.map(v=>v==null?null:v*length),...points.map(p=>p.q)]);
      const reactions=m.type==='D'?[applied]:beam(m.model,g.xs,g.from,g.to,q,points);
      const balance=sums(reactions).map((v,i)=>v==null||applied[i]==null?null:nice(v-applied[i]));
      if(balance.some((v,i)=>v!=null&&(!finite(v)||Math.abs(v)>1e-5*Math.max(1,Math.abs(applied[i])))))throw Error('ผลแรงไม่สมดุล กรุณาตรวจพิกัดและระยะ');
      results.set(m.id,{...g,points,applied,balance,q,reactions});
      total=addVec(total,q.map(v=>v==null?null:v*length));
      total=addVec(total,sums(explicit.map(p=>p.q)));
      reactions.forEach((force,i)=>{
        const a=m.supports[i];
        const to=String(a.to??'').trim();
        if(!to){errors.push({id:m.id,message:'จุดรองรับ '+(i+1)+' ยังไม่ระบุปลายทาง'});return}
        if(a.status==='external'){
          const kind=a.kind==='คาน'?'คาน':'เสา', key=kind+'|'+to;
          const d=destinations.get(key)||{kind,to,q:blank(),count:0};
          d.q=addVec(d.q,force);d.count++;destinations.set(key,d);
          traces.push({from:m.id,i:i+1,to,kind,q:force,at:good(a.at)?n(a.at):null});
        }else{
          const target=project.members.find(z=>z.id===to);
          if(!target||ordered(target)<=ordered(m)||!good(a.at)){
            errors.push({id:m.id,message:'จุดรองรับ '+(i+1)+' ต้องเลือกชิ้นส่วนถัดไปและใส่ตำแหน่งรับแรง'});
            return;
          }
          const list=incoming.get(to)||[];
          list.push({from:m.id+' · '+(i+1),x:n(a.at),q:force});incoming.set(to,list);
        }
      });
    }catch(e){errors.push({id:m.id,message:e.message})}
  }
  const rows=[...destinations.values()].sort((a,b)=>a.kind.localeCompare(b.kind,'th')||a.to.localeCompare(b.to,'th',{numeric:true}));
  const delivered=sums(rows.map(r=>r.q));
  return {results,rows,errors,traces,total,delivered,balance:delivered.map((v,i)=>v==null||total[i]==null?null:nice(v-total[i]))};
}

    const a=m.supports[i];a[d.key]=val;
    if(d.key==='status'){a.to='';a.at='';}
  }else if(d.scope==='point'){
    if(d.key==='q')m.points[i].q[j]=val;else m.points[i][d.key]=val;
  }
  save();
  clearTimeout(pendingRender);
  if(x.matches('select'))refreshAfterEdit();
  else pendingRender=setTimeout(refreshAfterEdit,220);
});
document.addEventListener('input',e=>{
  if(e.target.matches('[data-scope]'))clearTimeout(pendingRender);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const d=b.dataset,m=by(selected),i=Number(d.i);
  switch(d.action){
    case 'page':clearTimeout(pendingRender);page=d.page;selected='';render();return;
    case 'select-member':clearTimeout(pendingRender);selected=d.id;render();return;
    case 'new':
    case 'sample':
      if(!confirm(d.action==='new'?'สร้างโครงการว่างและแทนข้อมูลที่กำลังเปิดอยู่?':'โหลดโครงการตัวอย่างทับข้อมูลที่กำลังเปิดอยู่?'))return;
      state=sample();
      if(d.action==='new'){
        Object.assign(state,{name:'โครงการหลังคาใหม่',material:'',windDown:'',windUp:'',members:[]});
      }
      page='info';selected='';break;
    case 'export':download('Q-Roof-Project.json','application/json',JSON.stringify(state,null,2));return;
    case 'import':document.getElementById('fileInput').click();return;
    case 'csv':download('Q-Roof-Reactions.csv','text/csv;charset=utf-8',csvText());return;
    case 'csv-detail':download('Q-Roof-Reaction-Points.csv','text/csv;charset=utf-8',csvText(true));return;
    case 'print':print();return;
    case 'add-material':
      if(state.materialRows.length>=100){notify('ตารางรองรับวัสดุ 100 รายการ');return}
      state.materialRows.push({id:'M-'+uid().slice(0,8),name:'วัสดุใหม่',value:'',unit:'กก./ตร.ม. ผิวลาด',note:''});break;
    case 'remove-material':
      if(state.materialRows.at(i)?.id===state.material){notify('เลือกวัสดุมุงรายการอื่นก่อนลบรายการนี้');return}
      state.materialRows.splice(i,1);break;
    case 'add-member':
      if(state.members.length>=120){notify('โครงการรองรับ 120 ชิ้นส่วน');return}
      selected=newId(page);
      state.members.push({id:selected,type:page,own:0,spacing:carriesCover(page)?1.2:3,left:0,right:0,width:carriesCover(page)?.5:0,slope:'',model:'continuous',q:blank(),points:[],supports:Array.from({length:page==='D'?1:2},()=>support(''))});break;
    case 'clone-member': {
      if(state.members.length>=120){notify('โครงการรองรับ 120 ชิ้นส่วน');return}
      const copy=clone(m);copy.id=newId(m.type);state.members.push(copy);selected=copy.id;break;
    }
    case 'rename-member': {
      const id=prompt('รหัสชิ้นส่วนในแบบ',m.id)?.trim();
      if(!id||id===m.id)return;
      if(id.length>40||by(id)){notify('ใช้รหัสใหม่ที่ไม่ซ้ำและยาวไม่เกิน 40 ตัวอักษร');return}
      state.members.forEach(z=>z.supports.forEach(a=>{if(a.status==='member'&&a.to===m.id)a.to=id}));
      m.id=id;selected=id;break;
    }
    case 'remove-member':
      if(!confirm('ลบ '+m.id+' จากโครงการ?'))return;
      state.members=state.members.filter(x=>x.id!==m.id);
      state.members.forEach(z=>z.supports.forEach(a=>{if(a.status==='member'&&a.to===m.id){a.to='';a.at=''}}));selected='';break;
    case 'add-support':if(m.supports.length>=24){notify('รองรับสูงสุด 24 จุดต่อชิ้นส่วน');return}m.supports.push(support(''));break;
    case 'remove-support':m.supports.splice(i,1);break;
    case 'add-point':if(m.points.length>=40){notify('รองรับแรงจุดกรอกเอง 40 จุดต่อชิ้นส่วน');return}m.points.push({x:0,q:blank()});break;
    case 'remove-point':m.points.splice(i,1);break;
    default:return;
  }
  clearTimeout(pendingRender);save();render();
});
document.getElementById('fileInput').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';
  if(!file)return;
  try{
    if(file.size>2e6)throw Error('ไฟล์โครงการมีขนาดเกิน 2 เมกะไบต์');
    const x=JSON.parse(await file.text());validateFile(x);state=x;selected='';page='info';save();render();notify('เปิดไฟล์โครงการแล้ว');
  }catch(error){notify('นำเข้าไม่ได้ · '+error.message)}
});
render();
</script>
</body>
</html>
